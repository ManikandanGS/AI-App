server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-bug-resolver
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_bug_resolver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4}
  max-tokens: ${AI_MAX_TOKENS:4096}
  temperature: ${AI_TEMPERATURE:0.3}

jira:
  base-url: ${JIRA_BASE_URL:}
  username: ${JIRA_USERNAME:}
  api-token: ${JIRA_API_TOKEN:}

bitbucket:
  base-url: ${BITBUCKET_BASE_URL:https://api.bitbucket.org/2.0}
  username: ${BITBUCKET_USERNAME:}
  app-password: ${BITBUCKET_APP_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
